# Publishes one or more mod branches to Modrinth and CurseForge and tags them on GitHub.
# Started by mc-release (mod-tools) or by hand: Actions → Publish → Run workflow.
# The jar is always attached to the run as an artifact (mc-release archives it on the Synology).
name: Publish

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets, e.g. "UndeadNights@26.3-Fabric UndeadNights@26.3-NeoForge"'
        required: true
      type:
        description: Release type
        type: choice
        options: [release, beta, alpha]
        default: release
      dry_run:
        description: Only build and check, upload nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          json=$(printf '%s\n' $TARGETS | jq -R 'split("@") | {mod: .[0], branch: .[1]}' | jq -sc '{include: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    name: ${{ matrix.mod }}@${{ matrix.branch }}
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MOD: ${{ matrix.mod }}
      BRANCH: ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: release

      - name: Read mod from mods.yml
        id: cfg
        run: |
          q() { yq -r ".[strenv(MOD)]$1 // \"\"" release/mods.yml; }
          repo=$(q .repo)
          [ -n "$repo" ] || { echo "::error::$MOD missing in mods.yml"; exit 1; }
          {
            echo "repo=$repo"
            echo "modrinth=$(q .modrinth)"
            echo "curseforge=$(q .curseforge)"
            echo "game_versions=$(yq -r '.[strenv(MOD)].branches[strenv(BRANCH)].game_versions // [] | join(" ")' release/mods.yml)"
            echo "java=$(yq -r '.[strenv(MOD)].branches[strenv(BRANCH)].java // ""' release/mods.yml)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.cfg.outputs.repo }}
          ref: ${{ matrix.branch }}
          path: mod
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Check version
        id: meta
        working-directory: mod
        run: |
          prop() { sed -nE "s/^\s*$1\s*=\s*(.*\S)\s*$/\1/p" gradle.properties | head -1; }
          version=$(prop mod_version)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(Forge|NeoForge|Fabric)-mc(.+)$ ]]; then
            echo "::error::mod_version '$version' does not match the pattern x.y.z-Loader-mcVersion"; exit 1
          fi
          # display name on Modrinth and CurseForge: "1.1.1 (Fabric 26.1.2)" = mod version (loader + MC part of mod_version)
          title="${version%%-*} (${BASH_REMATCH[1]} ${BASH_REMATCH[2]})"
          loader=${BASH_REMATCH[1],,}
          mc=$(prop minecraft_version); mc=${mc:-${BASH_REMATCH[2]}}
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists, this version was already published"; exit 1
          fi
          java='${{ steps.cfg.outputs.java }}'
          if [ -z "$java" ]; then
            case "$mc" in
              1.[0-9].*|1.1[0-6]|1.1[0-6].*)  java=8  ;;
              1.17*|1.18*|1.19*|1.20|1.20.[0-4]) java=17 ;;
              1.20.*|1.21*)                   java=21 ;;
              *)                              java=25 ;;
            esac
          fi
          # JDK for the build: Gradle 9 projects run on 25 (newer Fabric Loom needs JVM 25 to run).
          # The jar target stays as set in build.gradle (release = …), so "java" for Modrinth/CurseForge does not change.
          build_java=$java
          gmajor=$(sed -nE 's/.*gradle-([0-9]+)\..*/\1/p' gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -1)
          if [ "${gmajor:-0}" -ge 9 ] && [ "$build_java" -lt 25 ]; then build_java=25; fi
          gv='${{ steps.cfg.outputs.game_versions }}'
          # dependencies on Modrinth/CurseForge from mods.yml (branch first, then loader), mc-publish syntax.
          # Empty: mc-publish reads them from the jar (works for Fabric; Forge/NeoForge mod IDs like
          # cloth_config do not match the project slugs).
          deps=$(LOADER=$loader yq -r '(.[strenv(MOD)].branches[strenv(BRANCH)].dependencies // .[strenv(MOD)].dependencies[strenv(LOADER)] // []) | .[]' ../release/mods.yml)
          {
            echo "version=$version"; echo "title=$title"; echo "loader=$loader"; echo "mc=$mc"; echo "tag=$tag"
            echo "java=$java"; echo "build_java=$build_java"
            # one version per line: mc-publish reads a space-separated value as ONE version range
            # ("26.1 26.1.1" matches nothing, CurseForge then refuses the upload)
            echo "game_versions<<EOF_GV"; printf '%s\n' ${gv:-$mc}; echo "EOF_GV"
            echo "dependencies<<EOF_DEP"; [ -z "$deps" ] || echo "$deps"; echo "EOF_DEP"
          } >> "$GITHUB_OUTPUT"
          echo "$MOD $version | Loader $loader | MC ${gv:-$mc} | Java $java (build $build_java) | Tag $tag | Dependencies: ${deps:-from the jar}" | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"

      - name: Changelog
        id: log
        working-directory: mod
        env:
          V: ${{ steps.meta.outputs.version }}
        run: |
          text=""
          if [ -f changelog.txt ]; then
            text=$(awk -v v="$V" '
              /^-+$/ { if (prev == v) { on=1; have=0; next } if (on) { done=1; exit } }
              on { if (have) print prev; prev=$0; have=1; next }
              { prev=$0 }
              END { if (on && !done && have) print prev }' changelog.txt)
          fi
          if [ -z "$text" ]; then
            echo "::warning::no section '$V' in changelog.txt, using the commits since the last tag"
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            text=$(git log --no-merges --pretty='- %s' ${last:+$last..HEAD})
          fi
          # changelog.txt -> Markdown for Modrinth, CurseForge and Discord: "Fixes" -> "**Fixes**" with a blank line
          # before it, " - x" -> "- x". Without the blank line Markdown glues the next heading to the last list item.
          text=$(printf '%s\n' "$text" | awk '
            /^[[:space:]]*$/ { next }
            /^[[:space:]]*[-*•][[:space:]]+/ { sub(/^[[:space:]]*[-*•][[:space:]]+/, "- "); print; next }
            /^[A-Z][A-Za-z ]*:?[[:space:]]*$/ { if (n++) print ""; sub(/[[:space:]]+$/, ""); print "**" $0 "**"; next }
            { print }')
          { echo "text<<EOF_CHANGELOG"; echo "$text"; echo "EOF_CHANGELOG"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.build_java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          jar=$(ls build/libs/*.jar | grep -vE -- '-(sources|dev|javadoc|slim|all)\.jar$' | head -1)
          [ -n "$jar" ] || { echo "::error::no jar in build/libs"; exit 1; }
          echo "JAR=mod/$jar" >> "$GITHUB_ENV"
          echo "Jar: $jar" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mod }}-${{ steps.meta.outputs.version }}
          path: ${{ env.JAR }}

      - name: Publish to Modrinth and CurseForge
        id: up
        if: ${{ !inputs.dry_run && steps.meta.outputs.dependencies == '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.cfg.outputs.modrinth }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.cfg.outputs.curseforge }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.JAR }}
          name: ${{ steps.meta.outputs.title }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ inputs.type }}
          loaders: ${{ steps.meta.outputs.loader }}
          game-versions: ${{ steps.meta.outputs.game_versions }}
          java: ${{ steps.meta.outputs.java }}
          changelog: ${{ steps.log.outputs.text }}

      - name: Publish to Modrinth and CurseForge (dependencies from mods.yml)
        id: up_deps
        if: ${{ !inputs.dry_run && steps.meta.outputs.dependencies != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.cfg.outputs.modrinth }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.cfg.outputs.curseforge }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.JAR }}
          name: ${{ steps.meta.outputs.title }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ inputs.type }}
          loaders: ${{ steps.meta.outputs.loader }}
          game-versions: ${{ steps.meta.outputs.game_versions }}
          java: ${{ steps.meta.outputs.java }}
          changelog: ${{ steps.log.outputs.text }}
          dependencies: ${{ steps.meta.outputs.dependencies }}

      - name: Create tag
        if: ${{ !inputs.dry_run }}
        working-directory: mod
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MR: ${{ steps.up.outputs.modrinth-url || steps.up_deps.outputs.modrinth-url }}
          CF: ${{ steps.up.outputs.curseforge-url || steps.up_deps.outputs.curseforge-url }}
        run: |
          git config user.name "MC-Mods-Pete"
          git config user.email "MC-Mods-Pete@users.noreply.github.com"
          git tag -a "$TAG" -m "$MOD ${TAG#v}" -m "Modrinth: $MR" -m "CurseForge: $CF"
          git push origin "$TAG"

      - name: Announcement data
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TITLE: ${{ steps.meta.outputs.title }}
          TYPE: ${{ inputs.type }}
          GV: ${{ steps.meta.outputs.game_versions }}
          MID: ${{ steps.cfg.outputs.modrinth }}
          CFID: ${{ steps.cfg.outputs.curseforge }}
          MR: ${{ steps.up.outputs.modrinth-url || steps.up_deps.outputs.modrinth-url }}
          CF: ${{ steps.up.outputs.curseforge-url || steps.up_deps.outputs.curseforge-url }}
          REPO: ${{ steps.cfg.outputs.repo }}
          CHANGELOG: ${{ steps.log.outputs.text }}
        run: |
          mkdir -p announce
          jq -n --arg mod "$MOD" --arg branch "$BRANCH" --arg version "$VERSION" --arg title "$TITLE" \
            --arg type "$TYPE" --arg gv "$GV" --arg mid "$MID" --arg cfid "$CFID" --arg mr "$MR" --arg cf "$CF" \
            --arg repo "$REPO" --arg changelog "$CHANGELOG" \
            '{mod: $mod, branch: $branch, version: $version, title: $title, type: $type,
              game_versions: ($gv | split("\n") | map(select(. != ""))), modrinth_id: $mid, curseforge_id: $cfid,
              modrinth_url: $mr, curseforge_url: $cf, repo: $repo, changelog: $changelog}' \
            > "announce/$MOD@$BRANCH.json"

      - name: Upload announcement data
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: announce-${{ matrix.mod }}-${{ matrix.branch }}
          path: announce/

  # Discord: only if ALL targets of the run were published. One message per mod and version
  # (x.y.z) with all files of that version, built from the release tags, so a later run that
  # publishes the missing targets of a failed run posts the complete message.
  announce:
    needs: publish
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: announce-*
          merge-multiple: true
          path: announce
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          yq -o json '.' mods.yml > "$RUNNER_TEMP/mods.json"
          jq -r '"\(.mod) \(.version | split("-")[0]) \(.type)"' announce/*.json | sort -u |
          while read -r mod version type; do
            out="$RUNNER_TEMP/announce-$mod-$version"
            python3 scripts/announce-from-tags.py "$RUNNER_TEMP/mods.json" "$mod" "$version" "$out" --type "$type"
            python3 scripts/discord-announce.py "$out"
          done
