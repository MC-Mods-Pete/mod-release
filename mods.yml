# Mods that can be published with the Publish workflow.
#   repo:        GitHub repo with one branch per Minecraft version and loader
#   modrinth:    Modrinth project ID
#   curseforge:  CurseForge project ID
#   branches:    optional per branch: java, dependencies, or game_versions as an override. Normally the
#                game versions come from the jar's own Minecraft range (fabric.mod.json / mods.toml).
#   dependencies: optional per loader (fabric, forge, neoforge) or per branch: dependencies on Modrinth and
#                CurseForge in mc-publish syntax, e.g. "cloth-config(required)", "modmenu(optional)".
#                The name is the project slug on both sites. Without it mc-publish reads the dependencies from
#                the jar: fine for Fabric, but Forge/NeoForge mod IDs like cloth_config match no project.
# An explicit game_versions list must match the jar's range, otherwise the workflow stops.
# Always quote versions ("1.20"), unquoted 1.20 is a number and becomes 1.2.

UndeadNights:
  repo: MC-Mods-Pete/UndeadNights
  modrinth: g0mmcQV2          # https://modrinth.com/mod/undead-nights
  curseforge: 1166914         # https://www.curseforge.com/minecraft/mc-mods/undead-nights

